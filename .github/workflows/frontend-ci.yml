name: Frontend CI

on:
  push:
    branches:
      - frontend/dev
    paths:
      - 'frontend/lakeSide-hotel/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/lakeSide-hotel/**'
      - '.github/workflows/frontend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/lakeSide-hotel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/lakeSide-hotel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
