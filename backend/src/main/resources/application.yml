spring:
  application:
    name: lakeSide-hotel

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  logging:
    file:
      name: logs/hotel-management.log
    level:
      root: INFO
      dev.ouhteen.lakeSide_hotel: DEBUG

server:
  port: 8080
